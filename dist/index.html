<html lang="zh-CN">
  <head>

    <title>整数网格面状布尔操作</title>
    <style>
:root {
  color-scheme: light;
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: #f5f6f8;
  color: #1f2430;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

.layout {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px;
}

header h1 {
  margin: 0 0 4px;
  font-size: 22px;
}

.subtitle {
  margin: 0 0 20px;
  color: #6b7280;
  font-size: 13px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  background: #fff;
  border: 1px solid #e3e6ea;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 18px;
}

.toolbar label {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.toolbar select {
  padding: 6px 8px;
  border: 1px solid #cfd4dc;
  border-radius: 6px;
  background: #fff;
}

.operations {
  display: flex;
  gap: 6px;
}

.operations button {
  border: 1px solid #cfd4dc;
  background: #f8fafc;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

.operations button.active,
.operations button:hover {
  background: #2456a6;
  border-color: #2456a6;
  color: #fff;
}

.check input {
  accent-color: #2456a6;
}

.content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 18px;
}

#stage {
  width: 100%;
  background: #fff;
  border: 1px solid #e3e6ea;
  border-radius: 10px;
}

.side {
  background: #fff;
  border: 1px solid #e3e6ea;
  border-radius: 10px;
  padding: 16px;
  font-size: 13px;
}

.side h2 {
  font-size: 14px;
  margin: 16px 0 8px;
}

.side h2:first-child {
  margin-top: 0;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.metrics div {
  background: #f5f7fb;
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.metrics span {
  color: #6b7280;
}

.metrics strong {
  font-size: 16px;
}

.diagnostics {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 240px;
  overflow: auto;
}

.diagnostics li {
  padding: 6px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  line-height: 1.4;
}

.diagnostics .error {
  background: #fdecea;
}

.diagnostics .warning {
  background: #fff6e0;
}

.diagnostics .info,
.diagnostics .ok {
  background: #eef6ee;
}

.diagnostics code {
  font-weight: 600;
}

.legend {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 8px;
}

.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  margin-right: 8px;
  vertical-align: middle;
}

.input-a {
  background: rgba(60, 110, 200, 0.35);
}

.input-b {
  background: rgba(210, 120, 40, 0.35);
}

.result {
  background: rgba(36, 86, 166, 0.4);
}

.hole {
  background: #c0392b;
}

.cancelled {
  background: repeating-linear-gradient(45deg, #c0392b 0 4px, #fff 4px 8px);
}

@media (max-width: 880px) {
  .content {
    grid-template-columns: 1fr;
  }
}

    <script type="module">
// module: ./src/diagnostics.js
const m0 = (() => {
// Collects structured, serialisable diagnostics instead of throwing away
// context. Codes use E_ (blocking), W_ (recovered automatically), I_ (info).

const SEVERITY = {
  E_NON_FINITE: "error",
  E_SELF_INTERSECT: "error",
  E_TRIVIAL_INPUT: "error",
  E_AREA_IDENTITY: "error",
  W_NEAR_THRESHOLD: "warning",
  W_COLLAPSED_EDGE: "warning",
  W_DEGENERATE_RING: "warning",
  W_UNWOUND_RING: "warning",
  W_SPLIT_INTERSECTION: "warning",
  W_ORPHAN_HOLE: "warning",
  W_AREA_MISMATCH: "warning",
  I_ZERO_RESULT: "info",
  I_TOUCH_POINT: "info",
};

class Diagnostics {
  constructor() {
    this.entries = [];
  }

  add(severity, code, detail = {}) {
    this.entries.push({ severity, code, detail, message: formatMessage(code, detail) });
  }

  error(code, detail) {
    this.add("error", code, detail);
  }

  warn(code, detail) {
    this.add("warning", code, detail);
  }

  info(code, detail) {
    this.add("info", code, detail);
  }

  hasErrors() {
    return this.entries.some((e) => e.severity === "error");
  }

  byCode(code) {
    return this.entries.filter((e) => e.code === code);
  }

  toJSON() {
    return this.entries;
  }

  text() {
    return this.entries
      .map((e) => `${e.severity[0].toUpperCase()} ${e.code}: ${e.message}`)
      .join("\n");
  }
}

function formatMessage(code, d) {
  const where = d.set !== undefined
    ? `set${d.set}/poly${d.polygon ?? "?"}/ring${d.ring ?? "?"}`
    : "";
  switch (code) {
    case "E_NON_FINITE":
      return `${where} vertex ${d.vertex} is not finite (${d.x}, ${d.y})`;
    case "E_SELF_INTERSECT":
      return `${where} ring self-intersects at (${d.x}, ${d.y})`;
    case "E_TRIVIAL_INPUT":
      return `operation needs at least two polygon sets; got ${d.given}`;
    case "W_NEAR_THRESHOLD":
      return `${where} vertex ${d.vertex} ${d.axis}=${d.scaledValue.toFixed(4)} is ${d.distanceToBoundary.toFixed(4)} from a half-unit boundary -> ${d.snappedTo}`;
    case "W_COLLAPSED_EDGE":
      return `${where} collapsed duplicates on snapping: ${d.before} -> ${d.after} vertices`;
    case "W_DEGENERATE_RING":
      return `${where} ring has only ${d.distinctVertices} distinct vertices and was dropped`;
    case "W_SPLIT_INTERSECTION":
      return `edge intersection at (${d.x}, ${d.y}) split into atomic edges`;
    case "W_UNWOUND_RING":
      return `${where} ring orientation corrected to ${d.expected}`;
    case "W_ORPHAN_HOLE":
      return `inner ring ${d.ring} is not contained in any outer ring`;
    case "W_AREA_MISMATCH":
      return `polygon ${d.polygon} triangulated area ${d.triangulated} != expected ${d.expected}`;
    case "I_ZERO_RESULT":
      return "operation produced an empty region";
    case "I_TOUCH_POINT":
      return `tangent contact at (${d.x}, ${d.y})`;
    default:
      return JSON.stringify(d);
  }
}

return { SEVERITY, Diagnostics };
})();

// module: ./src/rational.js
const m1 = (() => {
// Exact rational arithmetic on BigInt. Fractions are kept reduced with a
// positive denominator so equality comparisons stay canonical.

function gcd(a, b) {
  a = a < 0n ? -a : a;
  b = b < 0n ? -b : b;
  while (b !== 0n) {
    const t = a % b;
    a = b;
    b = t;
  }
  return a || 1n;
}

class Q {
  constructor(n, d = 1n) {
    if (d === 0n) throw new Error("rational with zero denominator");
    if (d < 0n) {
      n = -n;
      d = -d;
    }
    const g = gcd(n, d);
    this.n = n / g;
    this.d = d / g;
  }

  static of(n) {
    return new Q(BigInt(n));
  }

  add(o) {
    return new Q(this.n * o.d + o.n * this.d, this.d * o.d);
  }

  sub(o) {
    return new Q(this.n * o.d - o.n * this.d, this.d * o.d);
  }

  mul(o) {
    return new Q(this.n * o.n, this.d * o.d);
  }

  neg() {
    return new Q(-this.n, this.d);
  }

  cmp(o) {
    const l = this.n * o.d;
    const r = o.n * this.d;
    return l < r ? -1 : l > r ? 1 : 0;
  }

  equals(o) {
    return this.n === o.n && this.d === o.d;
  }

  isZero() {
    return this.n === 0n;
  }

  toNumber() {
    return Number(this.n) / Number(this.d);
  }

  toString() {
    return this.d === 1n ? `${this.n}` : `${this.n}/${this.d}`;
  }
}

const q = (n, d) => new Q(BigInt(n), BigInt(d));

// Cross product of vectors (b-a) x (c-a), all coordinates rational.
function cross(a, b, c) {
  const ux = b.x.sub(a.x);
  const uy = b.y.sub(a.y);
  const vx = c.x.sub(a.x);
  const vy = c.y.sub(a.y);
  return ux.mul(vy).sub(uy.mul(vx));
}

return { Q, q, cross };
})();

// module: ./src/quantize.js
const m2 = (() => {
const Q = m1.Q;

// Snaps floating-point coordinates onto an integer grid.
//
// Diagnostics emitted here:
//   E_NON_FINITE        coordinate is NaN/Infinity (feature rejected)
//   W_NEAR_THRESHOLD    scaled coordinate sits close to a k+0.5 rounding boundary
//   W_COLLAPSED_EDGE    an edge collapsed to a point after snapping
//   W_DEGENERATE_RING   a ring has fewer than 3 distinct vertices

const DEFAULT_NEAR_EPS = 0.025; // fraction of one grid unit

function roundHalfUp(v) {
  // Deterministic half-up rounding; ties at +0.5 go up, ties at -0.5 go down.
  return v >= 0 ? Math.floor(v + 0.5) : Math.ceil(v - 0.5);
}

function quantize(polygonSets, options = {}, diag) {
  const scale = options.scale ?? 1;
  if (!Number.isInteger(scale) || scale <= 0) {
    throw new Error("quantize: scale must be a positive integer");
  }
  const nearEps = options.nearEps ?? DEFAULT_NEAR_EPS;

  const out = polygonSets.map((set, setIndex) => ({
    id: set.id ?? `set-${setIndex}`,
    polygons: (set.polygons || []).map((poly, polyIndex) => {
      const rings = normalizeRings(poly).map((ring, ringIndex) =>
        snapRing(ring, scale, nearEps, diag, setIndex, polyIndex, ringIndex),
      );
      return { id: poly.id ?? `p-${setIndex}-${polyIndex}`, rings };
    }),
  }));
  return out;
}

function normalizeRings(poly) {
  if (Array.isArray(poly.rings)) return poly.rings;
  if (poly.outer) return [poly.outer, ...(poly.holes || [])];
  throw new Error("polygon requires either {rings} or {outer, holes}");
}

function snapRing(ring, scale, nearEps, diag, setIndex, polyIndex, ringIndex) {
  const loc = { set: setIndex, polygon: polyIndex, ring: ringIndex };
  const snapped = [];
  for (const [i, pt] of ring.entries()) {
    const x = Number(pt[0]);
    const y = Number(pt[1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      diag.error("E_NON_FINITE", { ...loc, vertex: i, x: pt[0], y: pt[1] });
      throw new Error(`non-finite coordinate at set${setIndex}/poly${polyIndex}/ring${ringIndex}#${i}`);
    }
    const sx = x * scale;
    const sy = y * scale;
    flagNearThreshold(sx, "x", i, loc, nearEps, diag);
    flagNearThreshold(sy, "y", i, loc, nearEps, diag);
    snapped.push({ x: new Q(BigInt(roundHalfUp(sx))), y: new Q(BigInt(roundHalfUp(sy))) });
  }

  const cleaned = [];
  for (const p of snapped) {
    const last = cleaned[cleaned.length - 1];
    if (!last || last.x !== p.x || last.y !== p.y) cleaned.push(p);
  }
  if (cleaned.length > 1) {
    const first = cleaned[0];
    const last = cleaned[cleaned.length - 1];
    if (first.x === last.x && first.y === last.y) cleaned.pop();
  }
  if (cleaned.length !== snapped.length) {
    diag.warn("W_COLLAPSED_EDGE", {
      ...loc,
      before: snapped.length,
      after: cleaned.length,
    });
  }
  if (cleaned.length < 3) {
    diag.warn("W_DEGENERATE_RING", { ...loc, distinctVertices: cleaned.length });
  }
  return cleaned;

  const nearest = roundHalfUp(scaled);
  // The two half-integer boundaries nearest to the rounded value.
  const dist = Math.min(Math.abs(scaled - (nearest - 0.5)), Math.abs(scaled - (nearest + 0.5)));
  if (dist < nearEps) {
    diag.warn("W_NEAR_THRESHOLD", {
      ...loc,
      vertex,
      axis,
      scaledValue: scaled,
      distanceToBoundary: dist,
      snappedTo: nearest,
    });
  }
}

})();

// module: ./src/geometry-int.js
const m3 = (() => {
// Exact integer/rational planar geometry primitives.

const Q = m1.Q;

function iPoint(x, y) {
  return { x: new Q(BigInt(x)), y: new Q(BigInt(y)) };
}

function orient(a, b, c) {
  // >0: c left of a->b (CCW), 0: collinear, <0: right
  const v = (b.x.sub(a.x)).mul(c.y.sub(a.y)).sub(
    (b.y.sub(a.y)).mul(c.x.sub(a.x)),
  );
  return v.isZero() ? 0 : v.n > 0n ? 1 : -1;
}

function onBoundingBox(p, a, b) {
  const minX = a.x.cmp(b.x) <= 0 ? a.x : b.x;
  const maxX = a.x.cmp(b.x) >= 0 ? a.x : b.x;
  const minY = a.y.cmp(b.y) <= 0 ? a.y : b.y;
  const maxY = a.y.cmp(b.y) >= 0 ? a.y : b.y;
  return (
    p.x.cmp(minX) >= 0 && p.x.cmp(maxX) <= 0 &&
    p.y.cmp(minY) >= 0 && p.y.cmp(maxY) <= 0
  );

function pointOnSegment(p, a, b) {
  return orient(a, b, p) === 0 && onBoundingBox(p, a, b);

// Returns { proper: bool, points: [rationalPoint, ...] }.
// A proper crossing yields one interior point; collinear overlap yields the
// up-to-two overlap endpoints (may be a single touch point).
function segmentIntersection(a, b, c, d) {
  const o1 = orient(a, b, c);
  const o2 = orient(a, b, d);
  const o3 = orient(c, d, a);
  const o4 = orient(c, d, b);

  if (o1 !== o2 && o1 !== 0 && o2 !== 0) {
    return { proper: true, points: [crossingPoint(a, b, c, d)] };
  }

  // Collinear / T-junction / endpoint touch: test every endpoint against the
  // opposite segment's interior-inclusive range.
  const touch = [];
  if (o1 === 0 && onBoundingBox(c, a, b)) touch.push(c);
  if (o2 === 0 && onBoundingBox(d, a, b)) touch.push(d);
  if (o3 === 0 && onBoundingBox(a, c, d)) touch.push(a);
  if (o4 === 0 && onBoundingBox(b, c, d)) touch.push(b);
  if (touch.length) {
    return { proper: false, points: dedupePoints(touch) };
  }

function dedupePoints(points) {
  const out = [];
  for (const p of points) {
    if (!out.some((q) => q.x.equals(p.x) && q.y.equals(p.y))) out.push(p);
  }
  return out;

  // Solve a + t(b-a) = c + s(d-c) using rational cross products.
  const rx = b.x.sub(a.x);
  const ry = b.y.sub(a.y);

  const sy = d.y.sub(c.y);

  const cay = c.y.sub(a.y);

    x: a.x.add(rx.mul(tq)),
    y: a.y.add(ry.mul(tq)),

  const span = dx.isZero() ? dy : dx;

  return p.x.equals(q.x) && p.y.equals(q.y);

// (proper crossing, T-junction, collinear overlap, tangent), so the output
// atomic edges have no interior intersections. All arithmetic stays rational.

const Q = m1.Q;
const orient = m3.orient;
const pointOnSegment = m3.pointOnSegment;
const pointsEqual = m3.pointsEqual;
const segmentIntersection = m3.segmentIntersection;
const segmentParam = m3.segmentParam;

function buildArrangement(sets, diag) {
  const rawEdges = collectEdges(sets, diag);
  const splitEdges = splitAllEdges(rawEdges, diag);
  return mergeAtomicEdges(splitEdges);

function collectEdges(sets, diag) {
  const edges = [];
  for (const set of sets) {
    for (const poly of set.polygons) {
      const rings = poly.rings.filter((ring) => ring.length >= 3);
      for (let ringIndex = 0; ringIndex < rings.length; ringIndex++) {
        const ring = rings[ringIndex];
        const signedArea = ringArea(ring);
        const expected = ringIndex === 0 ? 1 : -1;
        const orientation = signedArea.n > 0n ? 1 : -1;
        if (orientation !== expected) {
          diag.warn("W_UNWOUND_RING", {
            set: sets.indexOf(set),
            polygon: poly.id,
            ring: ringIndex,
            expected: expected === 1 ? "CCW" : "CW",
          });

        // The winding jump across a directed boundary edge is always +1 from
        // its right face to its left face; ring orientation is already carried
        // by the edge direction itself, so no extra sign factor is needed.
        void orientation;
        for (let i = 0; i < ring.length; i++) {
          const a = ring[i];
          const b = ring[(i + 1) % ring.length];
          edges.push({
            a,
            b,
            setId: set.id,
            ringIndex,
            polygonId: poly.id,
            sign: 1,
            direction: 1,
          });
        }
      }
    }
  }
  return edges;

function ringArea(ring) {
  // Doubled signed area, exact integer (or rational) value.
  let area = new Q(0n);
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i];
    const b = ring[(i + 1) % ring.length];
    area = area.add(a.x.mul(b.y).sub(a.y.mul(b.x)));
  }
  return area;
}

function splitAllEdges(rawEdges, diag) {
  const out = [];
  for (let i = 0; i < rawEdges.length; i++) {
    const edge = rawEdges[i];
    const cuts = new Map();
    cuts.set(pointKey(edge.a), edge.a);
    cuts.set(pointKey(edge.b), edge.b);

    for (let j = 0; j < rawEdges.length; j++) {
      if (i === j) continue;
      const other = rawEdges[j];
      const hit = segmentIntersection(edge.a, edge.b, other.a, other.b);
      if (!hit.points.length) continue;
      for (const p of hit.points) {
        if (pointOnSegment(p, edge.a, edge.b)) {
          const key = pointKey(p);
          if (!cuts.has(key)) {
            cuts.set(key, p);
            if (hit.proper || !isEndpoint(p, edge)) {
              diag.info("W_SPLIT_INTERSECTION", {
                x: p.x.toString(),
                y: p.y.toString(),
              });

      segmentParam(p, edge.a, edge.b).cmp(segmentParam(q, edge.a, edge.b)),
    );

      if (pointsEqual(ordered[k], ordered[k + 1])) continue;
      out.push({
        a: ordered[k],
        b: ordered[k + 1],
        source: {
          setId: edge.setId,
          polygonId: edge.polygonId,
          ringIndex: edge.ringIndex,
          sign: edge.sign,
          direction: edge.direction,
        },
      });
    }

  return out;

function isEndpoint(p, edge) {
  return pointsEqual(p, edge.a) || pointsEqual(p, edge.b);

  const merged = new Map();
  for (const e of atomic) {
    const key = edgeKey(e.a, e.b);
    let entry = merged.get(key);
    if (!entry) {
      // Keep the first-seen atomic edge orientation so all downstream
      // winding probes see one consistent directed edge.
      entry = { a: e.a, b: e.b, sources: [], key };
      merged.set(key, entry);
    }

  const simpleLoops = splitSelfTouchingLoops(loops);
  const polygons = classifyLoops(simpleLoops, diag);

  const boundaryKeys = new Set(boundary.map(({ edge }) => edge.key));
  const degenerateEdges = classifyDegenerateEdges(mergedEdges, boundaryKeys);

  const triangulation = polygons.map((poly, i) =>
    verifyTriangulable(poly, diag, i),
  );
  const triangulable = triangulation.every((t) => t.ok);

  if (!polygons.length) diag.info("I_ZERO_RESULT", {});

  return {
    operation,
    fillRule: rule,
    scale: options.scale ?? 1,
    setIds,
    polygons: polygons.map((p, i) => ({
      outer: exportRing(simplifyRing(p.outer)),
      holes: p.holes.map((h) => exportRing(simplifyRing(h))),
      area2: p.area2.toString(),
      area: p.area2.toNumber() / 2,
      triangles: triangulation[i].triangles,
    })),
    degenerateEdges: degenerateEdges.map((e) => ({
      a: exportPoint(e.a),
      b: exportPoint(e.b),
      tags: e.tags,
    })),
    quantizedInputs: quantized,
    diagnostics: diag.toJSON(),
    metrics: {
      atomicEdges: mergedEdges.length,
      boundaryEdges: boundary.length,
      loopCount: loops.length,
      polygonCount: polygons.length,
      triangulable,
    },
  };
}

function collectSourceSegments(sets) {
  const segments = [];
  for (const set of sets) {
    for (const poly of set.polygons) {
      for (const ring of poly.rings.filter((r) => r.length >= 3)) {
        for (let i = 0; i < ring.length; i++) {
          segments.push({
            a: ring[i],
            b: ring[(i + 1) % ring.length],
            setId: set.id,
          });
        }
      }
    }
  }
  return segments;
}

function exportRing(ring) {
  return ring.map(exportPoint);
}

function exportPoint(p) {
  return { x: p.x.toString(), y: p.y.toString(), n: [p.x.n, p.x.d, p.y.n, p.y.d] };
}

function emptyResult(operation, diag) {
  return {
    operation,
    polygons: [],
    degenerateEdges: [],
    diagnostics: diag.toJSON(),
    metrics: { atomicEdges: 0, boundaryEdges: 0, loopCount: 0, polygonCount: 0, triangulable: true },
  };
}



return { OPERATIONS, booleanPolygons, Diagnostics, signedArea2, pointKey };
})();

// module: ./view/view.js
const m10 = (() => {
// Browser-side interaction layer: runs the exact same boolean engine used by
// the Node tests and renders polygons, holes and degenerate edges on canvas.

const booleanPolygons = m8.booleanPolygons;
const fixtures = m9.fixtures;

const state = {
  fixture: "crossingSquares",
  operation: "union",
  showDegenerate: true,
  showGrid: true,
};

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const OP_COLORS = {
  union: "#2f7d4f",
  intersection: "#2456a6",
  difference: "#b35418",
  xor: "#7a3fa0",
};

function init() {
  const fixtureSelect = document.getElementById("fixture");
  for (const name of Object.keys(fixtures)) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    fixtureSelect.appendChild(option);
  }
  fixtureSelect.value = state.fixture;
  fixtureSelect.addEventListener("change", () => {
    state.fixture = fixtureSelect.value;
    run();
  });

  document.querySelectorAll("[data-op]").forEach((button) => {
    button.addEventListener("click", () => {
      state.operation = button.dataset.op;
      document.querySelectorAll("[data-op]").forEach((b) => b.classList.toggle("active", b === button));
      run();
    });
  });
  document.getElementById("toggle-degenerate").addEventListener("change", (e) => {
    state.showDegenerate = e.target.checked;
    run();
  });
  document.getElementById("toggle-grid").addEventListener("change", (e) => {
    state.showGrid = e.target.checked;
    run();
  });
  run();
}

function run() {
  const result = booleanPolygons(fixtures[state.fixture], { operation: state.operation });
  render(result);
  renderDiagnostics(result);
  renderMetrics(result);
}

function toNumber(point) {
  return { x: Number(point.x), y: Number(point.y) };
}

function computeBounds(result) {
  const points = [];
  for (const set of result.quantizedInputs) {
    for (const poly of set.polygons) {
      for (const ring of poly.rings) ring.forEach((p) => points.push(toNumber(p)));
    }
  }
  const xs = points.map((p) => p.x);
  const ys = points.map((p) => p.y);
  return {
    minX: Math.min(...xs),
    maxX: Math.max(...xs),
    minY: Math.min(...ys),
    maxY: Math.max(...ys),
  };
}

function render(result) {
  const bounds = computeBounds(result);
  const width = canvas.width;
  const height = canvas.height;
  const pad = 28;
  const spanX = Math.max(1, bounds.maxX - bounds.minX);
  const spanY = Math.max(1, bounds.maxY - bounds.minY);
  const scale = Math.min((width - pad * 2) / spanX, (height - pad * 2) / spanY);
  const project = (p) => ({
    x: pad + (p.x - bounds.minX) * scale,
    y: height - pad - (p.y - bounds.minY) * scale,
  });

  ctx.clearRect(0, 0, width, height);
  if (state.showGrid) drawGrid(bounds, project, width, height);
  drawInputs(result, project);
  drawResult(result, project);
  if (state.showDegenerate) drawDegenerate(result, project);
}

function drawGrid(bounds, project, width, height) {
  ctx.strokeStyle = "#e6e8ec";
  ctx.lineWidth = 1;
  for (let x = Math.floor(bounds.minX); x <= Math.ceil(bounds.maxX); x++) {
    const from = project({ x, y: bounds.minY });
    const to = project({ x, y: bounds.maxY });
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }
  for (let y = Math.floor(bounds.minY); y <= Math.ceil(bounds.maxY); y++) {
    const from = project({ x: bounds.minX, y });
    const to = project({ x: bounds.maxX, y });
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }
}

function traceRing(ring, project) {
  ctx.beginPath();
  ring.forEach((point, index) => {
    const p = project(toNumber(point));
    if (index === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
}

function drawInputs(result, project) {
  const colors = ["rgba(60,110,200,0.10)", "rgba(210,120,40,0.10)"];
  result.quantizedInputs.forEach((set, setIndex) => {
    ctx.fillStyle = colors[setIndex % colors.length];
    ctx.strokeStyle = setIndex === 0 ? "#3c6ec8" : "#d27828";
    ctx.lineWidth = 1.5;
    for (const poly of set.polygons) {
      for (const ring of poly.rings) {
        traceRing(ring, project);
        ctx.fill();
        ctx.stroke();
      }
    }
  });
}

function drawResult(result, project) {
  ctx.fillStyle = withAlpha(OP_COLORS[result.operation], 0.28);
  ctx.strokeStyle = OP_COLORS[result.operation];
  ctx.lineWidth = 2.5;
  for (const poly of result.polygons) {
    traceRing(poly.outer, project);
    ctx.fill();
    ctx.stroke();
    for (const hole of poly.holes) {
      traceRing(hole, project);
      ctx.strokeStyle = "#c0392b";
      ctx.stroke();
      ctx.strokeStyle = OP_COLORS[result.operation];
    }
  }
}

function drawDegenerate(result, project) {
  for (const edge of result.degenerateEdges) {
    const a = project(toNumber(edge.a));
    const b = project(toNumber(edge.b));
    const color = edge.tags.includes("cancelled") ? "#c0392b" : "#8a6d3b";
    ctx.strokeStyle = color;
    ctx.lineWidth = edge.tags.includes("cancelled") ? 3 : 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function withAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderDiagnostics(result) {
  const panel = document.getElementById("diagnostics");
  if (!result.diagnostics.length) {
    panel.innerHTML = '<li class="ok">无诊断信息</li>';
    return;
  }
  panel.innerHTML = result.diagnostics
    .map((entry) => `<li class="${entry.severity}"><code>${entry.code}</code> ${entry.message}</li>`)
    .join("");
}

function renderMetrics(result) {
  const panel = document.getElementById("metrics");
  const rows = [
    ["多边形数", result.metrics.polygonCount],
    ["原子边", result.metrics.atomicEdges],
    ["边界边", result.metrics.boundaryEdges],
    ["环数", result.metrics.loopCount],
    ["可三角化", result.metrics.triangulable ? "是" : "否"],
  ];
  panel.innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join("");
}

return { init };
})();
init();
</script>
