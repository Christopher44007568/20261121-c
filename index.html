<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Droplet SDF Sphere Tracing - WebGPU</title>
<style>
  body { margin: 0; background: #101014; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #ui { position: fixed; top: 8px; left: 8px; background: rgba(20,20,28,.85);
        padding: 10px 12px; border-radius: 8px; max-width: 260px; }
  #ui label { display: block; margin: 6px 0 2px; }
  #ui select, #ui input[type=range] { width: 100%; }
  #stats { margin-top: 8px; font-family: ui-monospace, monospace; white-space: pre; }
  canvas { display: block; width: 100vw; height: 100vh; }
  button { margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="ui">
  <label>smin mode
    <select id="sminMode">
      <option value="0">polynomial (non-conservative)</option>
      <option value="1" selected>log-sum-exp (conservative)</option>
    </select>
  </label>
  <label>view
    <select id="viewMode">
      <option value="0" selected>shaded</option>
      <option value="1">step heatmap</option>
      <option value="2">normals</option>
    </select>
  </label>
  <label>step mode
    <select id="stepMode">
      <option value="0" selected>standard (conservative)</option>
      <option value="1">over-relaxed (non-conservative)</option>
      <option value="2">over-relaxed + guard</option>
    </select>
  </label>
  <label>omega <span id="omVal"></span>
    <input id="omega" type="range" min="1.0" max="1.95" step="0.05" value="1.6">
  </label>
  <label>separation d <span id="sepVal"></span>
    <input id="sep" type="range" min="0.40" max="1.60" step="0.01" value="0.95">
  </label>
  <label>blend k <span id="kVal"></span>
    <input id="k" type="range" min="0.05" max="0.60" step="0.01" value="0.12">
  </label>
  <label><input id="shadow" type="checkbox" checked> soft shadow</label>
  <label><input id="animate" type="checkbox"> merge animation</label>
  <div>
    <button id="camOrbit">orbit view</button>
    <button id="camGraze">grazing view (neck)</button>
  </div>
  <div id="stats"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
