<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG 描边扩展预览器</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #182031;
      --ink: #e6ebf5;
      --muted: #8b96ab;
      --accent: #5b9dff;
      --border: #2a3550;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: 100vh;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 18px;
      overflow-y: auto;
    }
    h1 { font-size: 17px; margin: 0 0 16px; }
    label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 12px; }
    input, select, textarea {
      width: 100%;
      background: #0e1626;
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 70px; resize: vertical; font-family: ui-monospace, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      margin-top: 14px;
      width: 100%;
      background: var(--accent);
      color: #08111f;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2c3a57; color: var(--ink); }
    .toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .toggle input { width: auto; }
    main { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
    .canvas-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg { max-width: 100%; max-height: 58vh; }
    pre {
      background: #0e1626;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: 200px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <aside>
    <h1>描边扩展路径</h1>

    <label>路径 d（可编辑）</label>
    <textarea id="d">M80 180 L240 180 L160 50 Z</textarea>

    <div class="row">
      <div>
        <label>描边宽度</label>
        <input id="width" type="number" value="18" min="0" step="1" />
      </div>
      <div>
        <label>miter-limit</label>
        <input id="miterLimit" type="number" value="8" min="1" step="0.5" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>line-join</label>
        <select id="lineJoin">
          <option value="miter">miter</option>
          <option value="bevel">bevel</option>
          <option value="round">round</option>
        </select>
      </div>
      <div>
        <label>line-cap</label>
        <select id="lineCap">
          <option value="butt">butt</option>
          <option value="round">round</option>
          <option value="square">square</option>
        </select>
      </div>
    </div>

    <label>dasharray（逗号分隔，留空为实线）</label>
    <input id="dasharray" type="text" placeholder="例如 26,14" />
    <label>dashoffset</label>
    <input id="dashoffset" type="number" value="0" step="1" />

    <div class="row">
      <div>
        <label>scaleX（非均匀缩放）</label>
        <input id="scaleX" type="number" value="1" step="0.1" />
      </div>
      <div>
        <label>scaleY</label>
        <input id="scaleY" type="number" value="1" step="0.1" />
      </div>
    </div>

    <div class="toggle">
      <input id="showReference" type="checkbox" />
      <span>叠加浏览器原生描边参考（红色半透明）</span>
    </div>

    <button id="apply">重新生成扩展路径</button>
    <button id="copy" class="secondary">复制纯填充 path d</button>
    <button id="download" class="secondary">下载 fill-path.svg</button>
    <p class="hint">导出路径只含 fill，不含 stroke / dash 属性，可直接交给下游绘图仪预览。</p>
  </aside>

  <main>
    <div class="canvas-wrap" id="canvasWrap"></div>
    <div>
      <strong>纯填充导出（nonzero winding）</strong>
      <pre id="fillOutput"></pre>
    </div>
  </main>

  <script src="../dist/stroke-to-path.browser.js"></script>
  <script src="./preview.js"></script>
</body>
</html>
