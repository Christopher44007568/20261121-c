[package]
name = "wgpu-material-inspector"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Dual-window wgpu material inspector with a shared preview texture"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.23", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30.0.2"
winit = "0.30.12"

[profile.release]
lto = "thin"
strip = true

