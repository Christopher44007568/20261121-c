[workspace]
resolver = "2"
members = ["crates/pipe-core", "crates/pipe-bench", "crates/pipe-viewer"]

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
wgpu = "25"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
